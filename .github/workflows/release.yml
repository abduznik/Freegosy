name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Is Pre-release?'
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux?'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows?'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS?'
        type: boolean
        default: true

jobs:
  build_linux:
    name: Build Linux
    if: ${{ inputs.build_linux }}
    # Pinned to the oldest supported Ubuntu (not ubuntu-latest): the AppImage
    # links against whatever glibc/libstdc++ the build image has, and it must
    # run on older distros too. ubuntu-latest (24.04, glibc 2.39) produced
    # binaries needing GLIBC_2.38/GLIBCXX_3.4.32, which don't exist on 22.04
    # and broke AppImageHub's test runner (AppImage/appimage.github.io#7845).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev
          flutter pub get
      - name: Build Linux
        run: flutter build linux --release --build-name=${{ github.event.inputs.version }} --build-number=${{ github.run_number }}
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../freegosy-linux-x64.tar.gz .
      - name: Build AppImage
        run: |
          # Install appimagetool
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # libflutter_secure_storage_linux_plugin.so is a hard link-time
          # dependency of the freegosy binary (unlike the plugins that
          # dlopen themselves lazily), and it in turn needs libsecret-1.so.0.
          # Unlike the GTK stack, libsecret isn't guaranteed on every Linux
          # desktop (it's tied to GNOME Keyring/secret-service and commonly
          # absent on minimal or non-GNOME systems), so the dynamic linker
          # refused to even start the process there - no window, instant
          # exit. Bundle it so AppRun's LD_LIBRARY_PATH picks it up instead
          # of relying on the host to have it.
          SECRET_LIB=$(ldconfig -p | grep -F 'libsecret-1.so.0' | awk '{print $NF}' | head -n 1)
          if [ -n "$SECRET_LIB" ] ; then
            cp -L "$SECRET_LIB" AppDir/usr/bin/lib/libsecret-1.so.0
          else
            echo "::error::libsecret-1.so.0 not found on the build image; cannot bundle it"
            exit 1
          fi

          # libzstandard_linux_plugin.so itself needs libzstandard_linux.so
          # (the native zstd wrapper it dlopen-links against), but the
          # zstandard_linux pub package's CMakeLists sets its
          # *_bundled_libraries to empty, so Flutter's own bundling step
          # never copies it into bundle/ even though CMake still builds it
          # somewhere under build/linux/. Find and bundle it ourselves.
          ZSTD_LIB=$(find build/linux -name 'libzstandard_linux.so' -print -quit)
          if [ -n "$ZSTD_LIB" ] ; then
            cp -L "$ZSTD_LIB" AppDir/usr/bin/lib/libzstandard_linux.so
          else
            echo "::error::libzstandard_linux.so not found anywhere under build/linux; the zstandard_linux plugin will fail to load"
            exit 1
          fi

          # Create Desktop Entry
          cat > AppDir/usr/share/applications/freegosy.desktop <<EOF
          [Desktop Entry]
          Name=Freegosy
          Exec=freegosy
          Icon=freegosy
          Type=Application
          Categories=Game;
          EOF
          
          # Use icon
          cp web/icons/Icon-192.png AppDir/usr/share/icons/hicolor/256x256/apps/freegosy.png
          cp web/icons/Icon-192.png AppDir/freegosy.png
          
          # Mandatory files for AppImage
          cp AppDir/usr/share/applications/freegosy.desktop AppDir/
          # A plain symlink to the runner isn't enough: Flutter plugins that
          # load their native lib via bare-filename dlopen (e.g. zstandard's
          # DynamicLibrary.open('libzstandard_linux.so')) rely on
          # LD_LIBRARY_PATH, not the executable's own RPATH, so AppRun must
          # export the bundle's lib/ dir before exec'ing the binary.
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/freegosy" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Build AppImage
          ARCH=x86_64 /usr/local/bin/appimagetool --appimage-extract-and-run AppDir Freegosy-linux-x86_64.AppImage
      - name: Verify AppImage launches
        # Catches what AppImageHub's own test runner caught in #7845: a build
        # that links against a newer glibc/libstdc++ than AppImages are
        # supposed to require, so it dies on startup with no window. A quick
        # headless launch here fails release before the AppImage ships,
        # instead of failing silently on some other machine or distro.
        run: |
          sudo apt-get install -y xvfb dbus-x11
          chmod +x Freegosy-linux-x86_64.AppImage
          xvfb-run --auto-servernum ./Freegosy-linux-x86_64.AppImage --appimage-extract-and-run > appimage-launch.log 2>&1 &
          APID=$!
          sleep 10
          if kill -0 $APID 2>/dev/null; then
            echo "AppImage is still running after 10s - launch OK"
            kill $APID 2>/dev/null || true
            wait $APID 2>/dev/null || true
          else
            echo "AppImage exited within 10 seconds; launch log follows:"
            cat appimage-launch.log
            exit 1
          fi
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            freegosy-linux-x64.tar.gz
            Freegosy-linux-x86_64.AppImage

  build_windows:
    name: Build Windows Installer
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check pubspec version matches release version
        shell: bash
        # inno_bundle takes the installer version from pubspec.yaml, not from the
        # workflow input (v0.6.0 shipped as 0.5.11).
        run: |
          WANT="${{ github.event.inputs.version }}"
          WANT="${WANT#v}"
          HAVE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '[:cntrl:]')
          # pre-release suffixes (0.6.1-pre) are not part of pubspec's version
          if [ "${WANT%%-*}" != "$HAVE" ]; then
            echo "::error::pubspec.yaml is $HAVE but release is $WANT - bump pubspec first"
            exit 1
          fi
      - name: Build Windows Installer
        run: dart run inno_bundle:build --release
      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          # Find and copy installer to flat staging dir
          $installer = Get-ChildItem -Path build/windows/x64/installer/Release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            dir build/windows -Recurse
            throw "Could not find installer .exe"
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $installer.FullName -Destination staging/

          # Find freegosy.exe and zip the release bundle
          $exe = Get-ChildItem -Path build/windows -Filter "freegosy.exe" -Recurse | Where-Object { $_.FullName -like "*release*" } | Select-Object -First 1
          if (-not $exe) {
            dir build/windows -Recurse
            throw "Could not find freegosy.exe in build/windows"
          }
          $buildPath = $exe.DirectoryName
          Write-Host "Zipping from: $buildPath"
          Compress-Archive -Path "$buildPath/*" -DestinationPath staging/freegosy-windows-x64.zip

          # The same bundle plus portable.txt: a copy that keeps its data in its
          # own folder (e.g. on a USB stick). The plain zip stays non-portable.
          $portablePath = Join-Path $env:RUNNER_TEMP "freegosy-portable"
          Copy-Item -Recurse -Path $buildPath -Destination $portablePath
          New-Item -ItemType File -Path (Join-Path $portablePath "portable.txt") | Out-Null
          Compress-Archive -Path "$portablePath/*" -DestinationPath staging/freegosy-windows-x64-portable.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: staging/

  build_macos:
    name: Build macOS DMG
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGN_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
        run: |
          flutter build macos --release \
            --build-name=${{ github.event.inputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Ad-hoc sign macOS app
        run: |
          # Ad-hoc sign all frameworks and the app itself
          find build/macos/Build/Products/Release/freegosy.app/Contents/Frameworks -name "*.framework" -exec codesign --force --sign - {} + || true
          find build/macos/Build/Products/Release/freegosy.app/Contents/Frameworks -name "*.dylib" -exec codesign --force --sign - {} + || true
          codesign --force --sign - build/macos/Build/Products/Release/freegosy.app/Contents/MacOS/freegosy
          codesign --force --sign - build/macos/Build/Products/Release/freegosy.app
      - name: Create DMG
        run: |
          npx create-dmg build/macos/Build/Products/Release/freegosy.app --overwrite --no-code-sign
          mv *.dmg freegosy-macos.dmg
      - name: Create Zip (macOS)
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../freegosy-macos-x64.zip freegosy.app
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            freegosy-macos.dmg
            freegosy-macos-x64.zip

  update_nix_flake:
    name: Update Nix Flake
    if: ${{ inputs.build_linux }}
    needs: [build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download AppImage from Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist/
      - name: Compute hash and update flake.nix
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          HASH=$(sha256sum dist/Freegosy-linux-x86_64.AppImage | awk '{print $1}')
          SRI="sha256-$(echo "$HASH" | xxd -r -p | base64)"
          echo "AppImage SRI: $SRI"
          sed -i "s|hash = \".*\"|hash = \"${SRI}\"|" flake.nix
          sed -i "s|version = \".*\"|version = \"${VERSION}\"|" flake.nix
          cat flake.nix | grep -A2 "hash\|version"
      - name: Open PR with updated flake.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- flake.nix; then
            exit 0
          fi
          VERSION="${{ github.event.inputs.version }}"
          BRANCH="chore/flake-hash-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add flake.nix
          git commit -m "chore: update flake.nix hash for ${VERSION}"
          git push --force origin "$BRANCH"
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "chore: update flake.nix hash for ${VERSION}" \
            --body "Automated flake.nix hash/version bump from the release workflow." \
            || gh pr view "$BRANCH" --json url -q .url

  release:
    name: Create Release
    needs: [build_linux, build_windows, build_macos, update_nix_flake]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create artifacts directory
        run: mkdir artifacts

      - name: Download Linux Artifact
        if: ${{ inputs.build_linux }}
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/
          
      - name: Download Windows Artifact
        if: ${{ inputs.build_windows }}
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/
        continue-on-error: true
          
      - name: Download macOS Artifact
        if: ${{ inputs.build_macos }}
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            artifacts/freegosy-linux-x64.tar.gz
            artifacts/Freegosy-linux-x86_64.AppImage
            artifacts/*.exe
            artifacts/freegosy-windows-x64.zip
            artifacts/freegosy-windows-x64-portable.zip
            artifacts/freegosy-macos.dmg
            artifacts/freegosy-macos-x64.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
