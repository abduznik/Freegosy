name: Nix Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.5.10)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=0.5.10" >> $GITHUB_OUTPUT
          fi

      - name: Update version in flake.nix
        run: |
          sed -i "s/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" flake.nix

      - name: Build package
        run: nix build .#default --no-link --print-out-paths > result-path.txt

      - name: Get output path
        id: path
        run: echo "path=$(cat result-path.txt)" >> $GITHUB_OUTPUT

      - name: Create Nix package archive
        run: |
          tar -czf freegosy-nix-x86_64-linux.tar.gz -C "$(dirname ${{ steps.path.outputs.path }})" .

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: freegosy-nix-x86_64-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 60,
              body: `Nix package built for v${version}! Install with:\n\n\`\`\`bash
            nix run github:abduznik/Freegosy
            \`\`\`\n\nOr add to your flake inputs:\n\`\`\`nix
            inputs.freegosy.url = "github:abduznik/Freegosy";
            \`\`\``
            });
